<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Portal Login - Haritha Connect</title>
    <style>
        /* Styling based on the professional Admin theme */
        body { 
            font-family: Arial, sans-serif; 
            background-color: #2c3e50; /* Dark admin background */
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .login-container { 
            background: white; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.3); 
            width: 350px; 
            text-align: center;
        }
        h2 { 
            color: #2c3e50; 
            margin-bottom: 25px; 
            font-size: 1.8em;
        } 
        input[type="text"], input[type="password"] { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            box-sizing: border-box; 
            margin-bottom: 15px; 
        }
        button { 
            width: 100%; 
            padding: 12px; 
            background-color: #e74c3c; /* Authority Red */
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold; 
            transition: background-color 0.3s;
        }
        button:hover { 
            background-color: #c0392b; 
        }
        .messages { 
            list-style: none; 
            padding: 10px; 
            margin: 10px 0; 
            border-radius: 4px; 
            font-weight: bold; 
            background-color: #fcebeb; 
            color: #e74c3c; 
        }
        small {
            display: block;
            margin-top: 15px;
            color: #777;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Haritha Connect | Admin Login</h2>

        {% if messages %}
            {% for message in messages %}
                <div class="messages {{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %} 
            <label for="id_username" style="display: block; text-align: left; margin-bottom: 5px;">Username:</label>
            <input type="text" name="username" id="id_username" required>
            
            <label for="id_password" style="display: block; text-align: left; margin-bottom: 5px;">Password:</label>
            <input type="password" name="password" id="id_password" required>
            
            <button type="submit">Log In</button>
        </form>
        <small>Only Superusers can access the Admin Portal.</small>
    </div>
</body>
</html>

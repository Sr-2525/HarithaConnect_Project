<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Worker Login</title>
    <style>
        /* Simple styling for worker login */
        body { font-family: Arial, sans-serif; background-color: #0d47a1; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 8px 16px rgba(0,0,0,0.2); width: 350px; }
        h2 { text-align: center; color: #0d47a1; margin-bottom: 25px; } 
        input[type="text"], input[type="password"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; margin-bottom: 15px; }
        button { width: 100%; padding: 12px; background-color: #1565c0; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background-color: #0d47a1; }
        .messages { list-style: none; padding: 10px; margin: 10px 0; border-radius: 4px; font-weight: bold; background-color: #bbdefb; color: #0d47a1; }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Haritha Connect | Worker Login</h2>

        {% if messages %}
            {% for message in messages %}
                <div class="messages {{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %} 
            <label for="id_username">Username:</label>
            <input type="text" name="username" id="id_username" required>
            <label for="id_password">Password:</label>
            <input type="password" name="password" id="id_password" required>

            <button type="submit">Log In</button>
        </form>
    </div>
</body>
</html>
